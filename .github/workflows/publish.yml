name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  retag:
    name: retag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retag to stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT_TAG="${{ github.event.release.tag_name }}"
          VERSION="${DRAFT_TAG%-draft}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$DRAFT_TAG" = "$VERSION" ]; then
            echo "Tag is already stable, skipping retag"
            exit 0
          fi

          COMMIT=$(git rev-list -n 1 "$DRAFT_TAG")
          git tag "$VERSION" "$COMMIT"
          git push origin "$VERSION"

          gh release edit "$DRAFT_TAG" --tag "$VERSION"

          git push origin ":refs/tags/${DRAFT_TAG}"

  desktop:
    name: desktop (${{ matrix.runner }})
    needs: retag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            args: ""
          - runner: macos-latest
            args: "--target universal-apple-darwin"
          - runner: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.retag.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/cache@v4
        with:
          path: |
            desktop/node_modules
            desktop/.svelte-kit
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-desktop-v1-${{ hashFiles('desktop/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-desktop-v1

      - name: Install Linux tauri dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            patchelf

      - run: bun install
        working-directory: desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ needs.retag.outputs.version }}
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

  pages:
    name: pages
    needs: retag
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.retag.outputs.version }}

      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v3

      - uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/.svelte-kit
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-v1-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-v1

      - run: just build-web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

      - id: deploy
        uses: actions/deploy-pages@v4
