# Auto-label PRs based on changed files

rust:
  - changed-files:
    - any-glob-to-any-file: 'desktop/src-tauri/**/*.rs'
    - any-glob-to-any-file: 'desktop/src-tauri/Cargo.toml'
    - any-glob-to-any-file: 'schema/**/*.rs'
    - any-glob-to-any-file: 'schema/Cargo.toml'
    - any-glob-to-any-file: 'Cargo.toml'
    - any-glob-to-any-file: 'Cargo.lock'

frontend:
  - changed-files:
    - any-glob-to-any-file: 'desktop/src/**/*.svelte'
    - any-glob-to-any-file: 'desktop/src/**/*.ts'
    - any-glob-to-any-file: 'desktop/src/**/*.js'
    - any-glob-to-any-file: 'desktop/src/**/*.css'
    - any-glob-to-any-file: 'desktop/src/**/*.scss'
    - any-glob-to-any-file: 'web/src/**/*.svelte'
    - any-glob-to-any-file: 'web/src/**/*.ts'
    - any-glob-to-any-file: 'web/src/**/*.js'
    - any-glob-to-any-file: 'web/src/**/*.css'
    - any-glob-to-any-file: 'web/src/**/*.scss'
    - any-glob-to-any-file: 'schema/bindings/**/*.ts'
    - any-glob-to-any-file: 'schema/client/**/*.ts'

tauri:
  - changed-files:
    - any-glob-to-any-file: 'desktop/src-tauri/tauri.conf.json'
    - any-glob-to-any-file: 'desktop/src-tauri/build.rs'
    - any-glob-to-any-file: 'desktop/src-tauri/capabilities/**'

ci/cd:
  - changed-files:
    - any-glob-to-any-file: '.github/workflows/**'
    - any-glob-to-any-file: '.github/dependabot.yml'
    - any-glob-to-any-file: '.github/labeler.yml'
    - any-glob-to-any-file: '.github/labels.yml'
    - any-glob-to-any-file: 'justfile'
    - any-glob-to-any-file: 'flake.nix'
    - any-glob-to-any-file: 'flake.lock'

tests:
  - changed-files:
    - any-glob-to-any-file: '**/*test*.rs'
    - any-glob-to-any-file: '**/*test*.ts'
    - any-glob-to-any-file: '**/tests/**'

documentation:
  - changed-files:
    - any-glob-to-any-file: '**/*.md'

dependencies:
  - changed-files:
    - any-glob-to-any-file: '**/Cargo.toml'
    - any-glob-to-any-file: 'Cargo.lock'
    - any-glob-to-any-file: '**/package.json'
    - any-glob-to-any-file: '**/bun.lock'
